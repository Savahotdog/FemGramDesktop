name: Build FemGram Fast (5 Seconds)

on:
  workflow_dispatch:

jobs:
  build-fast:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Create Femboy Pastel Pink Theme
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "FemGram_Release/modules/core"
          $theme = @"
          windowBg: #fff0f6;
          windowFg: #4a154b;
          windowBgOver: #ffdeeb;
          windowBgRipple: #fcc2d7;
          windowFgOver: #4a154b;
          windowSubTextFg: #862e9c;
          windowSubTextFgOver: #ae3ec9;
          windowBoldFg: #d6336c;
          windowBoldFgOver: #c2255c;
          windowBgActive: #f06595;
          windowFgActive: #ffffff;
          activeButtonBg: #f06595;
          activeButtonBgOver: #e64980;
          activeButtonBgRipple: #d6336c;
          activeButtonFg: #ffffff;
          activeButtonFgOver: #ffffff;
          lightButtonBg: #fff0f6;
          lightButtonBgOver: #ffdeeb;
          lightButtonBgRipple: #fcc2d7;
          lightButtonFg: #d6336c;
          lightButtonFgOver: #c2255c;
          msgOutBg: #ffdeeb;
          msgOutBgSelected: #fcc2d7;
          msgInBg: #f8f0fc;
          msgInBgSelected: #f3d9fa;
          msgServiceBg: #f06595aa;
          msgServiceFg: #ffffff;
          historyPeer1NameFg: #d6336c;
          historyPeer2NameFg: #ae3ec9;
          historyPeer4NameFg: #f06595;
          dialogsBg: #fff0f6;
          dialogsBgOver: #ffdeeb;
          dialogsBgActive: #f06595;
          dialogsNameFg: #4a154b;
          dialogsTextFg: #862e9c;
          dialogsDateFg: #ae3ec9;
          "@
          Set-Content -Path "FemGram_Release/Femboy_Pastel_Pink.tdesktop-theme" -Value $theme -Encoding UTF8

      - name: Compile Native FemGram Launcher
        shell: pwsh
        run: |
          $code = @"
          using System;
          using System.Diagnostics;
          using System.IO;
          using System.Windows.Forms;

          class Program {
              [STAThread]
              static void Main() {
                  string baseDir = AppDomain.CurrentDomain.BaseDirectory;
                  string modulesDir = Path.Combine(baseDir, "modules");
                  string coreDir = Path.Combine(modulesDir, "core");
                  string proxyPath = Path.Combine(modulesDir, "TgWsProxy_windows.exe");
                  string ayuExe = Path.Combine(coreDir, "AyuGram.exe");

                  if (!File.Exists(ayuExe)) {
                      var found = Directory.GetFiles(coreDir, "*.exe", SearchOption.AllDirectories);
                      if (found.Length > 0) ayuExe = found;
                  }

                  if (!File.Exists(ayuExe)) {
                      MessageBox.Show("1. Положи AyuGram.exe в папку: modules\\core\\\n2. Положи TgWsProxy_windows.exe в папку: modules\\", "FemGram — Первый запуск");
                      Process.Start("explorer.exe", modulesDir);
                      return;
                  }

                  Process proxyProc = null;
                  try {
                      if (File.Exists(proxyPath)) {
                          var psi = new ProcessStartInfo {
                              FileName = proxyPath,
                              Arguments = "--port 1443 --secret 0123456789abcdef0123456789abcdef",
                              UseShellExecute = false,
                              CreateNoWindow = true,
                              WindowStyle = ProcessWindowStyle.Hidden
                          };
                          proxyProc = Process.Start(psi);
                      }

                      var tgProc = Process.Start(new ProcessStartInfo {
                          FileName = ayuExe,
                          WorkingDirectory = Path.GetDirectoryName(ayuExe)
                      });
                      if (tgProc != null) tgProc.WaitForExit();
                  } finally {
                      if (proxyProc != null && !proxyProc.HasExited) {
                          try { proxyProc.Kill(); } catch { }
                      }
                  }
              }
          }
          "@
          Set-Content -Path "launcher.cs" -Value $code -Encoding UTF8
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:winexe /out:"FemGram_Release/FemGram.exe" /reference:System.Windows.Forms.dll launcher.cs
          Compress-Archive -Path "FemGram_Release/*" -DestinationPath "FemGram_Fast_Windows.zip"

      - name: Upload Ready FemGram Build
        uses: actions/upload-artifact@v4
        with:
          name: FemGram-Fast-Windows
          path: FemGram_Fast_Windows.zip
