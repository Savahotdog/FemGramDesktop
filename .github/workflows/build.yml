name: Build FemGram Desktop (Windows)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup Build Structure & Checkout
        uses: actions/checkout@v4
        with:
          path: tdesktop
          submodules: recursive

      - name: Cache Compiled Libraries
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: |
            ThirdParty
            Libraries
          key: win64-libs-v2-${{ hashFiles('tdesktop/Telegram/build/prepare/**') }}

      - name: Create ThirdParty & Libraries Folders
        if: steps.cache-libs.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "ThirdParty"
          New-Item -ItemType Directory -Force -Path "Libraries"

      - name: Apply FemGram Patches
        working-directory: tdesktop
        run: python femgram_patcher.py

      - name: Download Flowseal TGWS Proxy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "Release/modules"
          $release = Invoke-RestMethod -Uri "https://github.com"
          $asset = $release.assets | Where-Object { $_.name -like "*windows*.exe" } | Select-Object -First 1
          if ($asset) {
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "Release/modules/TgWsProxy_windows.exe"
          }

      - name: Prepare Libraries
        if: steps.cache-libs.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          call tdesktop\Telegram\build\prepare\win.bat

      - name: Configure & Build Release
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
          cd tdesktop\Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627
          cmake --build ..\out --config Release --target Telegram --parallel

      - name: Package FemGram
        shell: pwsh
        run: |
          $exePath = Get-ChildItem -Path "tdesktop/out" -Filter "AyuGram.exe" -Recurse | Select-Object -First 1
          if (-not $exePath) {
            $exePath = Get-ChildItem -Path "tdesktop/out" -Filter "Telegram.exe" -Recurse | Select-Object -First 1
          }
          if ($exePath) {
            Copy-Item $exePath.FullName -Destination "Release/FemGram.exe"
            Get-ChildItem -Path $exePath.DirectoryName -Filter "*.dll" | Copy-Item -Destination "Release/"
            Compress-Archive -Path "Release/*" -DestinationPath "FemGram_Windows_x64.zip"
          } else {
            Write-Error "Compiled executable not found!"
            exit 1
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FemGram-Windows-x64
          path: FemGram_Windows_x64.zip
